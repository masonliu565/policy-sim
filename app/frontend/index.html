<!doctype html>
<meta charset="utf-8">
<style>
  :root { --pad: 14px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body {
    font-family: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--ocean);
    transition: background .45s ease, color .45s ease;
  }
  #wrap { display: flex; gap: var(--pad); padding: var(--pad); height: 100vh; }
  #mapcol { flex: 0 0 65%; position: relative; border-radius: 12px; overflow: hidden;
            background: var(--ocean); border: 1px solid var(--edge); }
  #side   { flex: 1 1 35%; display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto; }

  svg { display: block; width: 100%; height: 100%; }
  #camera { transition: transform .75s cubic-bezier(.22,.61,.36,1); }

  .panel { background: var(--panel); border: 1px solid var(--edge);
           border-radius: 10px; padding: 12px 14px;
           transition: background .45s ease, border-color .45s ease; }
  .panel h2 { margin: 0 0 2px 0; font-size: 15px; letter-spacing: .01em; }
  .panel .sub { font-size: 12px; color: var(--soft); margin-bottom: 8px; }

  textarea { width: 100%; min-height: 74px; resize: vertical; font: inherit;
             font-size: 13px; padding: 8px; border-radius: 7px;
             border: 1px solid var(--edge); background: var(--panel);
             color: var(--ink); }

  button { font: inherit; font-size: 12.5px; cursor: pointer; border-radius: 7px;
           padding: 6px 11px; border: 1px solid var(--edge);
           background: var(--panel); color: var(--ink); }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #23201a; font-weight: 650; }
  .row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }

  /* ---- interval bars. Scale is shared between national and metro on purpose:
         a metro band is wider because a metro subsample carries more sampling
         error, and equalising the bars would hide exactly that. ---- */
  .metric { margin: 9px 0 11px 0; }
  .metric .name { font-size: 12px; color: var(--soft); }
  .metric .val  { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .metric .delta{ font-size: 11.5px; color: var(--soft); }
  .track { position: relative; height: 17px; margin-top: 5px;
           background: var(--track); border-radius: 3px; }
  .band  { position: absolute; top: 3px; height: 11px; background: var(--band);
           border-radius: 2px; opacity: .9; }
  .med   { position: absolute; top: 0; width: 3px; height: 17px; background: var(--medink); }
  .base  { position: absolute; top: -2px; width: 0; height: 21px;
           border-left: 2px dashed var(--baseline); }
  .scale { display: flex; justify-content: space-between;
           font-size: 10px; color: var(--soft); margin-top: 2px; }

  .marker      { cursor: pointer; }
  .marker:hover .dot { stroke-width: 3.2; }
  .marker .lbl { font-size: 11px; font-weight: 650; paint-order: stroke;
                 stroke: var(--panel); stroke-width: 3.4px; fill: var(--ink); }
  .marker.dim  { opacity: .38; }
  .marker.nodata .dot { fill: var(--panel); }

  #back { position: absolute; left: 12px; top: 12px; display: none; z-index: 5; }
  #legend { position: absolute; right: 12px; bottom: 10px; font-size: 10.5px;
            color: var(--soft); background: var(--panel); border: 1px solid var(--edge);
            padding: 4px 8px; border-radius: 6px; }
  .warn { font-size: 11.5px; color: var(--ink); background: var(--warnbg);
          border-left: 4px solid var(--warnedge); padding: 6px 9px;
          border-radius: 4px; margin-top: 7px; }
  .stack { font-size: 11.5px; color: var(--soft); }
  .stack b { color: var(--ink); }
</style>

<div id="wrap">
  <div id="mapcol">
    <button id="back">← National view</button>
    <svg id="svg"><g id="camera"></g></svg>
    <div id="legend">bar = 5th–95th percentile · slab = median · dashed = baseline</div>
  </div>
  <div id="side">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2 id="scope">United States</h2>
        <div class="row">
          <button id="daynight">Night</button>
          <button id="reset">Reset</button>
        </div>
      </div>
      <div class="sub" id="scopesub"></div>
      <div id="stack" class="stack"></div>
    </div>

    <div class="panel" id="summary">
      <h2>Aggregate summary</h2>
      <div class="sub" id="summarysub"></div>
      <div id="metrics"></div>
    </div>

    <div class="panel">
      <h2>Policy</h2>
      <div class="sub">Describe a policy in plain English.</div>
      <textarea id="policy" placeholder="e.g. give every family $300 a month per kid, phase it out over $150k"></textarea>
      <div class="row" style="margin-top:7px">
        <button class="primary" id="readit">Read it</button>
        <span class="sub" style="margin:0" id="policynote"></span>
      </div>
    </div>

    <div class="panel">
      <h2>Top changed groups</h2>
      <div class="sub" id="groupsub"></div>
      <div id="groups"></div>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Streamlit component protocol, implemented directly so the component needs no
// build step and no bundled dependency.
// ---------------------------------------------------------------------------
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setValue(value) { send("streamlit:setComponentValue", { value: value, dataType: "json" }); }
function setHeight(h)    { send("streamlit:setFrameHeight", { height: h }); }

let CFG = null, DATA = null, PAL = null;
let mode = "day", selected = null;

// ---------------------------------------------------------------------------
// Isometric projection.
//
// Faux-3D: a plain 2:1 isometric transform on a quantised grid, with two shaded
// side faces per tile giving the extrusion. No WebGL, no perspective — the
// dimensionality is entirely in the projection and the shading.
// ---------------------------------------------------------------------------
const TW = 26, TH = 13, EH = 9;   // tile width, tile height, extrusion height

function iso(gx, gy, lift) {
  return [(gx - gy) * (TW / 2), (gx + gy) * (TH / 2) - (lift || 0) * EH];
}

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// Decorative only. Nothing here encodes a policy figure, a population or an
// estimate — it is a smooth deterministic function of position, used to break
// up the surface so the projection reads as terrain rather than a flat sheet.
function relief(gx, gy) {
  const v = Math.sin(gx * 0.37) * Math.cos(gy * 0.53) + 0.55 * Math.sin((gx + gy) * 0.21);
  return v;
}

function buildTiles() {
  const b = CFG.bounds, tx = CFG.tile, ty = CFG.tile_y;
  const nx = Math.ceil((b.x1 - b.x0) / tx), ny = Math.ceil((b.y1 - b.y0) / ty);
  const tiles = [];
  for (let iy = 0; iy <= ny; iy++) {
    for (let ix = 0; ix <= nx; ix++) {
      const px = b.x0 + ix * tx, py = b.y0 + iy * ty;
      if (!pointInPoly(px, py, CFG.outline)) continue;
      const r = relief(ix, iy);
      // Grid y is inverted so north renders to the back of the scene.
      tiles.push({ gx: ix, gy: ny - iy, lift: r > 0.45 ? 1 : 0, green: r > 0.02 });
    }
  }
  tiles.sort((a, b2) => (a.gx + a.gy) - (b2.gx + b2.gy));
  return tiles;
}

function lonlatToGrid(x, y) {
  const b = CFG.bounds, tx = CFG.tile, ty = CFG.tile_y;
  const ny = Math.ceil((b.y1 - b.y0) / ty);
  return [(x - b.x0) / tx, ny - (y - b.y0) / ty];
}

function tilePath(gx, gy, lift) {
  const [x, y] = iso(gx, gy, lift);
  const hw = TW / 2, hh = TH / 2;
  const top = `M${x} ${y - hh}L${x + hw} ${y}L${x} ${y + hh}L${x - hw} ${y}Z`;
  const left = `M${x - hw} ${y}L${x} ${y + hh}L${x} ${y + hh + EH}L${x - hw} ${y + EH}Z`;
  const right = `M${x + hw} ${y}L${x} ${y + hh}L${x} ${y + hh + EH}L${x + hw} ${y + EH}Z`;
  return [top, left, right];
}

// The outline is deliberately coarse, so a coastal city (San Francisco) can
// land just outside it. Snapping the marker to the nearest land tile keeps
// every marker on the map without editing the cartography to suit it.
function snapToLand(gx, gy, tiles) {
  let best = null, bestD = Infinity;
  for (const t of tiles) {
    const d = (t.gx - gx) * (t.gx - gx) + (t.gy - gy) * (t.gy - gy);
    if (d < bestD) { bestD = d; best = t; }
  }
  return best ? [best.gx, best.gy, best.lift] : [gx, gy, 0];
}

function renderMap() {
  const tiles = buildTiles();
  const parts = [];
  for (const t of tiles) {
    const [top, left, right] = tilePath(t.gx, t.gy, t.lift);
    const topFill = t.green ? PAL.terrain : PAL.land;
    const sideL = t.green ? PAL.terrain_shadow : PAL.land_shadow;
    parts.push(`<path d="${left}" fill="${sideL}"/>`);
    parts.push(`<path d="${right}" fill="${PAL.land_shadow}"/>`);
    parts.push(`<path d="${top}" fill="${topFill}"/>`);
  }

  // City markers, drawn last so they sit above every tile.
  for (const c of CFG.cities) {
    const [rawx, rawy] = lonlatToGrid(c.x, c.y);
    const [gx, gy, lift] = snapToLand(rawx, rawy, tiles);
    const [x, y] = iso(gx, gy, lift + 1);
    const has = !!(DATA.by_metro && DATA.by_metro[c.metro_key]);
    parts.push(
      `<g class="marker ${has ? "" : "nodata"}" data-key="${c.metro_key}" data-x="${x}" data-y="${y}">
         <line x1="${x}" y1="${y}" x2="${x}" y2="${y - 17}" stroke="${PAL.ink}" stroke-width="1.6"/>
         <circle class="dot" cx="${x}" cy="${y - 21}" r="6"
                 fill="${has ? PAL.accent : PAL.panel}" stroke="${PAL.ink}" stroke-width="2"/>
         <text class="lbl" x="${x}" y="${y - 30}" text-anchor="middle">${c.label}</text>
       </g>`);
  }

  const cam = document.getElementById("camera");
  cam.innerHTML = parts.join("");

  // Fit the whole scene once, then treat that as the national camera.
  const svg = document.getElementById("svg");
  const bb = cam.getBBox();
  const m = 26;
  svg.setAttribute("viewBox", `${bb.x - m} ${bb.y - m} ${bb.width + 2 * m} ${bb.height + 2 * m}`);
  HOME = { x: bb.x - m, y: bb.y - m, w: bb.width + 2 * m, h: bb.height + 2 * m };

  cam.querySelectorAll(".marker").forEach((el) => {
    el.addEventListener("click", () => selectMetro(el.dataset.key,
      parseFloat(el.dataset.x), parseFloat(el.dataset.y)));
  });
}

let HOME = null;

function camera(x, y, w, h) {
  // Smooth because the viewBox is animated via a transform on #camera rather
  // than by rewriting the viewBox, which would not transition.
  const svg = document.getElementById("svg");
  const vb = HOME;
  const scale = vb.w / w;
  const cx = x + w / 2, cy = y + h / 2;
  const homeCx = vb.x + vb.w / 2, homeCy = vb.y + vb.h / 2;
  document.getElementById("camera").setAttribute(
    "transform",
    `translate(${homeCx} ${homeCy}) scale(${scale}) translate(${-cx} ${-cy})`);
}

function selectMetro(key, x, y) {
  if (!(DATA.by_metro && DATA.by_metro[key])) {
    // A marker with no entry in by_metro says so. It never borrows another
    // metro's figures.
    selected = key;
    renderSide();
    document.querySelectorAll(".marker").forEach((m) =>
      m.classList.toggle("dim", m.dataset.key !== key));
    document.getElementById("back").style.display = "block";
    camera(x - 150, y - 110, 300, 220);
    setValue({ metro: key, mode: mode, reset: false, policy_text: null, nonce: Date.now() });
    return;
  }
  selected = key;
  renderSide();
  document.querySelectorAll(".marker").forEach((m) =>
    m.classList.toggle("dim", m.dataset.key !== key));
  document.getElementById("back").style.display = "block";
  camera(x - 150, y - 110, 300, 220);
  setValue({ metro: key, mode: mode, reset: false, policy_text: null, nonce: Date.now() });
}

function goNational() {
  selected = null;
  renderSide();
  document.querySelectorAll(".marker").forEach((m) => m.classList.remove("dim"));
  document.getElementById("back").style.display = "none";
  document.getElementById("camera").setAttribute("transform", "");
  setValue({ metro: null, mode: mode, reset: false, policy_text: null, nonce: Date.now() });
}

// ---------------------------------------------------------------------------
// Side panel
// ---------------------------------------------------------------------------
function fmt(v, unit) {
  if (v === null || v === undefined) return "—";
  if (unit === "percent") return (v * 100).toFixed(1) + "%";
  if (unit === "currency") {
    const a = Math.abs(v);
    if (a >= 1e12) return "$" + (v / 1e12).toFixed(2) + "T";
    if (a >= 1e9) return "$" + (v / 1e9).toFixed(1) + "B";
    if (a >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
    return "$" + Math.round(v).toLocaleString();
  }
  return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(2);
}

function bar(band, domain, unit) {
  const span = domain[1] - domain[0] || 1;
  const pct = (v) => ((v - domain[0]) / span) * 100;
  const parts = [
    `<div class="track">`,
    `<div class="band" style="left:${pct(band.p05)}%;width:${Math.max(0.8, pct(band.p95) - pct(band.p05))}%"></div>`,
    `<div class="med" style="left:calc(${pct(band.median)}% - 1.5px)"></div>`,
  ];
  if (band.baseline !== null && band.baseline !== undefined)
    parts.push(`<div class="base" style="left:${pct(band.baseline)}%"></div>`);
  parts.push(`</div><div class="scale"><span>${fmt(domain[0], unit)}</span><span>${fmt(domain[1], unit)}</span></div>`);
  return parts.join("");
}

function metricBlock(key, band, domain, unit, label) {
  let delta = "";
  if (band.baseline !== null && band.baseline !== undefined) {
    const lo = Math.min(band.p05 - band.baseline, band.p95 - band.baseline);
    const hi = Math.max(band.p05 - band.baseline, band.p95 - band.baseline);
    const mid = band.median - band.baseline;
    const sgn = (v) => (v >= 0 ? "+" : "−");
    const d = (v) => unit === "percent"
      ? sgn(v) + Math.abs(v * 100).toFixed(1) + " pts"
      : sgn(v) + fmt(Math.abs(v), unit);
    delta = `${d(mid)} [${d(lo)} – ${d(hi)}] vs baseline`;
  }
  return `<div class="metric">
      <div class="name">${label}</div>
      <div class="val">${fmt(band.median, unit)} [${fmt(band.p05, unit)} – ${fmt(band.p95, unit)}]</div>
      <div class="delta">${delta}</div>
      ${bar(band, domain, unit)}
    </div>`;
}

function renderSide() {
  const metroKey = selected;
  const metro = metroKey && DATA.by_metro ? DATA.by_metro[metroKey] : null;
  const cityLabel = (CFG.cities.find((c) => c.metro_key === metroKey) || {}).label;

  document.getElementById("scope").textContent = metroKey ? cityLabel : "United States";
  document.getElementById("scopesub").textContent = metroKey
    ? "Metro estimates. Bands are wider than national because a metro subsample carries more sampling error — the bars are on the same scale, not normalised."
    : DATA.label + " · " + (DATA.n_seeds ? DATA.n_seeds + " seeds" : "seeds not stated");

  const stack = DATA.stack || [];
  document.getElementById("stack").innerHTML = stack.length
    ? "Applied: " + stack.map((s) => "<b>" + s + "</b>").join(" + ")
    : "<b>Baseline</b> — no policy applied.";

  // Metrics
  const box = document.getElementById("metrics");
  const sub = document.getElementById("summarysub");

  if (metroKey && !metro) {
    box.innerHTML = "";
    sub.innerHTML = "";
    box.innerHTML = `<div class="warn"><b>No metro estimate available for ${cityLabel}.</b>
      This scenario has no <code>by_metro</code> entry for it, so there is nothing to show.
      No national or neighbouring figure is substituted.</div>`;
    document.getElementById("groups").innerHTML = "";
    document.getElementById("groupsub").textContent = "";
    return;
  }

  const impact = metro ? (metro.impact || {}) : DATA.impact;
  sub.textContent = metroKey
    ? "Read from by_metro." + metroKey
    : "Read from the scenario file. No live model call.";

  box.innerHTML = Object.keys(impact).map((k) =>
    metricBlock(k, impact[k], DATA.domains[k] || [0, 1], DATA.units[k] || "number",
                DATA.labels[k] || k.replace(/_/g, " "))).join("") ||
    `<div class="warn">This scenario carries no impact outcomes.</div>`;

  // Support / groups
  const gbox = document.getElementById("groups");
  const gsub = document.getElementById("groupsub");
  const groups = metro ? (metro.by_group || []) : (DATA.by_group || []);

  if (!groups.length) {
    gsub.textContent = "";
    gbox.innerHTML = `<div class="warn">No subgroup figures in this scenario${metroKey ? " for this metro" : ""}.</div>`;
  } else {
    gsub.textContent = "Ranked by absolute change in disposable income where the scenario provides it.";
    gbox.innerHTML = groups.map((g) => {
      const ev = (g.evidence_ids || []).length
        ? `<div class="delta">evidence: ${g.evidence_ids.join(", ")}</div>` : "";
      const noBand = (g.disposable_income_delta !== undefined && g.disposable_income_delta !== null)
        ? `<div class="warn">${fmt(g.disposable_income_delta, "currency")} income change, ${(g.pct_better_off * 100).toFixed(0)}% better off — point estimates, no interval published.</div>`
        : "";
      return `<div class="metric">
          <div class="name">${g.group_type.replace(/_/g, " ")}</div>
          <div class="val">${g.group} — ${fmt(g.support.median, "percent")} [${fmt(g.support.p05, "percent")} – ${fmt(g.support.p95, "percent")}]</div>
          ${ev}
          ${bar(g.support, DATA.support_domain, "percent")}
          ${noBand}
        </div>`;
    }).join("");
  }
}

// ---------------------------------------------------------------------------
function applyPalette() {
  PAL = CFG.palettes[mode];
  const r = document.documentElement.style;
  r.setProperty("--ocean", PAL.ocean);
  r.setProperty("--panel", PAL.panel);
  r.setProperty("--edge", PAL.panel_edge);
  r.setProperty("--ink", PAL.ink);
  r.setProperty("--soft", PAL.ink_soft);
  r.setProperty("--band", PAL.band);
  r.setProperty("--track", PAL.band_soft);
  r.setProperty("--medink", PAL.median);
  r.setProperty("--baseline", PAL.baseline);
  r.setProperty("--accent", PAL.accent);
  r.setProperty("--warnbg", PAL.warn_bg);
  r.setProperty("--warnedge", PAL.warn_edge);
  document.getElementById("daynight").textContent = mode === "day" ? "Night" : "Day";
}

document.getElementById("back").addEventListener("click", goNational);

document.getElementById("daynight").addEventListener("click", () => {
  mode = mode === "day" ? "night" : "day";
  applyPalette();
  renderMap();
  if (selected) {
    const el = document.querySelector(`.marker[data-key="${selected}"]`);
    document.querySelectorAll(".marker").forEach((m) => m.classList.toggle("dim", m.dataset.key !== selected));
    if (el) camera(parseFloat(el.dataset.x) - 150, parseFloat(el.dataset.y) - 110, 300, 220);
    document.getElementById("back").style.display = "block";
  }
  setValue({ metro: selected, mode: mode, reset: false, policy_text: null, nonce: Date.now() });
});

document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("policy").value = "";
  goNational();
  setValue({ metro: null, mode: mode, reset: true, policy_text: null, nonce: Date.now() });
});

document.getElementById("readit").addEventListener("click", () => {
  const t = document.getElementById("policy").value.trim();
  if (!t) { document.getElementById("policynote").textContent = "Type a policy first."; return; }
  document.getElementById("policynote").textContent = "Reading…";
  setValue({ metro: selected, mode: mode, reset: false, policy_text: t, nonce: Date.now() });
});

window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const args = e.data.args || {};
  const first = CFG === null;
  CFG = args.config;
  DATA = args.data;
  mode = args.mode || "day";
  applyPalette();
  if (first || args.rebuild) { renderMap(); }
  document.getElementById("policynote").textContent = args.policy_note || "";
  renderSide();
  setHeight(Math.max(620, args.height || 700));
});

send("streamlit:componentReady", { apiVersion: 1 });
setHeight(700);
</script>
