<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }

  #hint {
    position: absolute; right: 14px; bottom: 11px;
    font: 500 10px/1 "DM Sans", -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .06em; color: #4d7361; opacity: .85;
    pointer-events: none; user-select: none;
  }
  #reset {
    position: absolute; right: 12px; top: 11px;
    font: 550 10px/1 "DM Sans", -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .04em; background: #f9f9ef; color: #31553f;
    border: 1px solid #dfe5d3; border-radius: 7px; padding: 7px 11px;
    cursor: pointer;
  }
  #reset:hover { background: #eef2e2; }
  #reset[hidden] { display: none; }
</style>

<div id="wrap">
